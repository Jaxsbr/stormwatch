<!doctype html><html><head><meta charset="utf-8"><title>Stormwatch character motion review</title><style>body{margin:0;background:#19251e;color:#eee2c1;font:14px system-ui}header{height:60px;display:flex;align-items:center;gap:15px;padding:0 20px}button{padding:10px;min-height:40px}#field{height:calc(100vh - 60px)}#field canvas{display:block;width:100%;height:100%}#recording{max-width:180px}video{position:fixed;right:12px;bottom:12px;width:320px;background:#111}a{color:#efcc76}</style></head><body><header><strong>Character motion lab — staged roster</strong><button id="start">Start wave</button><button id="pause">Pause</button><button id="record">Record 10 seconds</button><span id="recording"></span><a id="download" hidden>Download recording</a><output id="status"></output></header><div id="field"></div><script type="module">
import { Battlefield } from '/src/render/battlefield.ts';
import { Game } from '/src/sim/game.ts';
import { lanternPass } from '/src/content/lantern-pass.ts';
const level={...lanternPass,waves:[{title:'Roster motion review',reward:0,groups:['raider','runner','armored','boss'].map(kind=>({kind,count:1,gap:1.5}))}]}; const game=new Game(level,'reach');

const field=new Battlefield(document.querySelector('#field'));field.load(lanternPass);
let last=performance.now(),elapsed=0;
function draw(now){const dt=Math.min((now-last)/1000,.05);last=now;game.advance(dt);field.update(game,null,dt);document.querySelector("#status").textContent=`${game.state.phase} ${game.state.clock.toFixed(1)}s | shots ${game.state.towers.map(t=>t.shots).join("/")} | rigs ${field.diagnostics().rigs.length}`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
document.querySelector('#start').onclick=()=>game.startWave();document.querySelector('#pause').onclick=()=>game.pause();
document.querySelector('#record').onclick=()=>{const stream=field.renderer.domElement.captureStream(30),parts=[];const mime=['video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));const r=new MediaRecorder(stream,{mimeType:mime});r.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};r.onstop=()=>{const url=URL.createObjectURL(new Blob(parts,{type:mime}));const a=document.querySelector('#download');a.href=url;a.download='character-motion-10s.webm';a.hidden=false;document.querySelector('#recording').textContent='Captured staged scene';stream.getTracks().forEach(t=>t.stop());};r.start();document.querySelector('#recording').textContent='Recording…';setTimeout(()=>r.stop(),10000);};
</script></body></html>
