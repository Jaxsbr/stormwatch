<!doctype html><html><head><meta charset="utf-8"><title>Animal defender prototype</title><style>body{margin:0;background:#19251e;color:#eee2c1;font:16px system-ui}header{height:70px;display:flex;align-items:center;gap:20px;padding:0 24px}button{padding:10px;min-height:44px}#field{height:calc(100vh - 70px);background:center/cover url('/art/v2/woodland-clearing-v3/atlas.webp')}canvas{display:block}output{font-size:13px}</style></head><body><header><b>Animal defenders · direction and action prototypes</b><select id="role" aria-label="Defender to inspect"><option>Squirrel archer</option><option>Skunk slinger</option><option>Turtle trapper</option><option>Donkey trader</option></select><button id="pause">Pause</button><output>Top: right / left / front / rear · Bottom: all four roles · staged actions</output></header><div id="field"></div><script type="module">
import * as THREE from 'three';
import {CutoutResource} from '/src/render/cutout.ts';
import {netGeometry} from '/src/render/combat-shapes.ts';
import {DefenderRig} from '/src/render/defender-rig.ts';
const host=document.querySelector('#field'),scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-640,640,330,-330,.1,1000);camera.position.z=100;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));host.append(renderer.domElement);
function resize(){const r=host.getBoundingClientRect();renderer.setSize(r.width,r.height);const span=Math.max(660,1280/(r.width/r.height));camera.top=span/2;camera.bottom=-span/2;camera.left=-span/2*r.width/r.height;camera.right=-camera.left;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();
const resources=['squirrel','skunk','turtle','donkey'].flatMap(a=>['side','front','rear'].map(v=>new CutoutResource(`${a}-${v}-defender-v1`)));let rigs=[],clock=0,last=performance.now(),paused=false;
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume':'Pause'};
let selectedRole=0;
const layout=[[-360,70,0,false],[-120,70,0,true],[120,70,1,false],[360,70,2,false],[-360,-160,0,false],[-120,-160,3,false],[120,-160,6,false],[360,-160,9,false]];
document.querySelector('#role').onchange=e=>{selectedRole=e.target.selectedIndex;for(const r of rigs){scene.remove(r.group);r.dispose()}rigs=[];layout[0][2]=layout[1][2]=selectedRole*3;layout[2][2]=selectedRole*3+1;layout[3][2]=selectedRole*3+2;clock=0};
const padTexture=new THREE.TextureLoader().load("/art/v2/defender-placement-tile/tile.webp");padTexture.colorSpace=THREE.SRGBColorSpace;
function tile(x,y){const m=new THREE.Mesh(new THREE.PlaneGeometry(82,36),new THREE.MeshBasicMaterial({map:padTexture,transparent:true,depthTest:false}));m.position.set(x,y-15,0);m.renderOrder=1;scene.add(m)}for(const [x,y] of layout)tile(x,y);
const shots=[];
function draw(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!paused)clock+=dt;
if(!rigs.length&&resources.every(r=>r.definition)){for(const [x,y,index,mirror] of layout){const rig=new DefenderRig(resources[index],110,mirror);rig.group.position.set(x,y,0);scene.add(rig.group);rigs.push(rig)}}
const age=clock%2;
for(const rig of rigs)rig.update(age,2-age);
if(!paused&&Math.floor((clock-dt)/2)!==Math.floor(clock/2))for(const [i,rig] of rigs.entries()){const role=i<4?selectedRole:i-4;if(role===3)continue;const mesh=new THREE.Mesh(role===1?new THREE.CircleGeometry(6,12):role===2?netGeometry():new THREE.PlaneGeometry(16,2),new THREE.MeshBasicMaterial({color:role===1?0xb0ac99:0xf5dca3,depthTest:false}));mesh.rotation.z=i===2||i===3?Math.PI/2:0;mesh.position.copy(rig.muzzle());mesh.renderOrder=1100;scene.add(mesh);shots.push({mesh,age:0,dx:i===1?-1:i===2||i===3?0:1,dy:i===2?-1:i===3?1:0})}
for(let i=shots.length-1;i>=0;i--){const s=shots[i];if(!paused){s.age+=dt;s.mesh.position.x+=dt*230*s.dx;s.mesh.position.y+=dt*230*s.dy}if(s.age>1.3){scene.remove(s.mesh);s.mesh.geometry.dispose();s.mesh.material.dispose();shots.splice(i,1)}}renderer.render(scene,camera);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
