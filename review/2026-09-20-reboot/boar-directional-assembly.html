<!doctype html><meta charset="utf-8"><title>Character cutout assembly comparison</title><style>body{margin:0;background:#192a2c;color:#eadfc7;font:16px system-ui}h1,p{margin:18px}canvas{width:1200px;max-width:100%}</style><h1>Boar directional assembly · fixed scale, no animation</h1><p>Boar side reference, front and rear. Static rest pose verifies overlap and camera only; it is not a gait acceptance.</p><canvas width="1200" height="440"></canvas><script type="module">
const c=document.querySelector('canvas'),ctx=c.getContext('2d');ctx.fillStyle='#1e3436';ctx.fillRect(0,0,1200,440);const names=['boar','boar-front','boar-rear'];for(let i=0;i<names.length;i++){const d=await fetch(`/art/v2/${names[i]}-rig-v1/rig.json`).then(r=>r.json());const body=d.parts[0],s=.26,x=220+i*370,y=275;const imgs=await Promise.all(d.parts.map(async p=>{const im=new Image();im.src='/'+p.texture;await im.decode();return{p,im}}));for(const{p,im}of imgs.sort((a,b)=>a.p.z-b.p.z)){const a=p.attachTo?body.attachments[p.attachTo.split('.')[1]]:body.pivot;ctx.drawImage(im,x+(a[0]-body.pivot[0]-p.pivot[0]*p.scale)*s,y+(a[1]-body.pivot[1]-p.pivot[1]*p.scale)*s,p.rect[2]*p.scale*s,p.rect[3]*p.scale*s);}ctx.fillStyle='#eadfc7';ctx.font='20px system-ui';ctx.fillText(names[i],x-40,390);}
</script>
