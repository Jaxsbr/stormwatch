<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ticket 04 · Woven net cue</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          15px system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        background: #17221b;
        color: #f6edda;
      }
      header {
        min-height: 54px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        flex-wrap: wrap;
      }
      strong {
        margin-right: 8px;
      }
      button {
        min-height: 40px;
        padding: 7px 12px;
        color: inherit;
        background: #344533;
        border: 1px solid #a88e5e;
        border-radius: 7px;
      }
      #state {
        margin-left: auto;
        color: #e6d6ad;
      }
      #field {
        height: calc(100vh - 70px);
        min-height: 400px;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Ticket 04 · Woven floor net</strong>
      <button id="wave1">Wave 1</button>
      <button id="wave4">Wave 4</button>
      <button id="pause">Pause / resume</button>
      <span id="state" aria-live="polite"></span>
    </header>
    <div id="field"></div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
