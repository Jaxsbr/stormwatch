<!doctype html><html lang="en"><meta charset="utf-8"><title>Rat shield rig assembly</title><style>body{margin:0;background:#182524;color:#eee;font:16px system-ui}h1,p{margin:12px 24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px}.cell{background:#34443f;border:1px solid #748277;padding:8px;text-align:center}canvas{width:100%;height:290px;display:block}.cell b{display:block;padding:5px}</style><h1>Rat shield assembly · staged art review</h1><p>Each cell uses the runtime CharacterRig and v2 cutout resources. Animation poses are fixed to compare attachment and occlusion.</p><div class="grid" id="grid"></div><script type="module">
import * as THREE from 'three';
import {CharacterRig} from '/src/render/character-rig.ts';
import {CutoutResource} from '/src/render/cutout.ts';
const grid=document.querySelector('#grid');
for(const [view,id] of [['side old','rat-rig-v1'],['side','rat-rig-v2'],['front old','rat-front-rig-v1'],['front','rat-front-rig-v2'],['rear old','rat-rear-rig-v1'],['rear','rat-rear-rig-v2']]){
 const res=new CutoutResource(id);while(!res.definition)await new Promise(r=>setTimeout(r,20));
 for(const [pose,shield] of (view.includes('old')?[['fixed',{raised:false,age:1,hitAge:Infinity}]]:[['lowered',{raised:false,age:1,hitAge:Infinity}],['raised',{raised:true,age:1,hitAge:Infinity}],['impact',{raised:true,age:1,hitAge:0.12}],...(view==='side'?[['swing A',{raised:false,age:1,hitAge:Infinity}],['swing B',{raised:false,age:1,hitAge:Infinity}]]:[])])){
 const cell=document.createElement('div');cell.className='cell';cell.innerHTML=`<b>${view} · ${pose}</b>`;const canvas=document.createElement('canvas');cell.append(canvas);grid.append(cell);canvas.width=380;canvas.height=290;
 const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setSize(380,290,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
 const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(-160,160,160,-90,0.1,100);camera.position.z=10;const rig=new CharacterRig(res,230);scene.add(rig.group);rig.group.position.set(0,-43,0);
 rig.update(pose==='swing A'?0.1625:pose==='swing B'?0.4875:0,d=>({x:d,y:0}),1,0xffffff,Infinity,shield);renderer.render(scene,camera);
 }
}
</script></html>
