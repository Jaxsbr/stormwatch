<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Skunk runtime acceptance</title>
    <style>
      body {
        margin: 0;
        background: #14221a;
        color: #eee;
        font: 15px system-ui;
      }
      header {
        padding: 12px 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      button,
      select {
        font: inherit;
        padding: 10px;
        margin: 3px;
        min-height: 44px;
      }
      #field {
        height: calc(100vh - 180px);
        min-height: 330px;
        position: relative;
      }
      #state {
        display: block;
        padding: 8px;
      }
      p {
        margin: 5px 0;
        color: #bcc9bc;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Skunk · real battlefield acceptance</h1>
      <p>
        Synthetic resources and crowd fixture · actual Game shots, poison and
        Battlefield · owner approval pending
      </p>
      <button id="pause">Pause</button><button id="step">Step frame</button
      ><button id="advance">Advance 5 seconds</button
      ><button id="restart">Fresh attempt</button
      ><button id="sell">Sell defenders</button
      ><label
        >Speed
        <select id="speed">
          <option value="1">Normal</option>
          <option value="0.2">Slow</option>
        </select></label
      ><output id="state">Loading…</output>
    </header>
    <div id="field"></div>
    <script type="module" src="main.ts"></script>
  </body>
</html>
